submission:
  title: "Clinical Trial Risk Intelligence Copilot"
  problem_statement: >
    Clinical trial operations teams can see yesterday's deviations, but struggle to identify which site is becoming tomorrow's problem. Fragmented protocol rules, deviation records and monitoring history make it difficult to prove why risk is rising or choose an intervention with confidence.
  solution_summary: >
    Clinical Trial Risk Intelligence Copilot turns verified protocol rules and synthetic site data into an evidence-backed risk radar. It combines transparent risk trends, an evidence chain, IBM Bob investigation, intervention simulation and CAPA-ready decisions in one workflow.
  key_features:
    - "CUSUM-style emerging-risk radar that prioritizes deteriorating sites"
    - "Deterministic protocol compliance with rule-linked evidence records"
    - "IBM Bob and MCP investigation boundary for evidence-backed answers"
    - "Scenario simulator that projects the impact of reducing a dominant driver"
    - "Confidence-aware intelligence using data quality and monitoring history"
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Python standard-library HTTP server"]
    ibm_technologies: ["IBM Bob", "MCP integration boundary"]
    databases: ["Planned SQLite evidence store"]
    other: ["Synthetic clinical-trial data", "GitHub Actions"]
  what_we_are_most_proud_of: >
    The demo follows one complete decision loop: find the fastest-deteriorating site, prove the driver through linked evidence, ask Bob why it is risky, and test a documented intervention before creating an action.
  known_limitations: >
    This first runnable slice uses deterministic seeded synthetic data and a local Bob response adapter. Live PDF protocol extraction, persistent SQLite storage, authenticated IBM Bob calls, CAPA persistence and production deployment remain planned follow-up work.

