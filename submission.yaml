submission:
  title: "TrialGuard AI — Clinical Trial Risk Monitor & Protocol Deviation Detector"
  problem_statement: >
    Clinical trial operations teams can see yesterday's deviations but cannot identify which site is becoming tomorrow's problem. Fragmented protocol rules, deviation records, and monitoring history make it difficult to prove why risk is rising or choose an intervention with confidence.
  solution_summary: >
    TrialGuard AI is a polished clinical-trial risk intelligence platform. It monitors 42 synthetic clinical sites, evaluates all 8 protocol rules using a deterministic deviation engine (~975 deviations, 7 types), classifies severity via transparent 6-factor scoring, and calculates multi-factor site risk scores with leading indicators, predictive trend, and natural score variation. The dashboard features a TrialGuard Risk Indicator, "What Needs Your Attention" panel, Early Warning Center, and a 42-cell Site Risk Heatmap. IBM Bob connects through a real MCP server (src/mcp_server.py, mcp[cli] v2.2, STDIO) exposing 13 tools with RBAC. The web app uses a clearly-labelled "TrialGuard Demo Assistant" (NOT IBM Bob) that routes questions through the same 13 tool contracts. Random/general chat input never triggers clinical tool calls.
  key_features:
    - "Deterministic rule-based deviation detection across 8 protocol rules and 7 deviation types"
    - "Transparent 6-factor severity classification (MAJOR/MINOR/ADMINISTRATIVE) with per-factor breakdown"
    - "Multi-factor site risk engine with leading indicators, 6-period sparkline, predictive scoring, and natural variation"
    - "Clinical Command Center Dashboard: TrialGuard Risk Indicator, What Needs Your Attention, Early Warning Center, Site Risk Heatmap"
    - "Real IBM Bob MCP integration: src/mcp_server.py exposes 13 tools via STDIO; configured in .bob/mcp.json; RBAC enforced"
    - "TrialGuard Demo Assistant (clearly NOT IBM Bob): routes web chat through same 13 tool contracts with evidence panel"
    - "Bob Investigation Mode: step-by-step 6-call investigation workflow with visual progress tracking"
    - "CAPA Workflow Tracker with Approve/Reject (role-gated); AI root-cause labelled as requiring qualified review"
    - "Protocol Patient Compare: direct eligibility compliance check from Protocol Analysis page"
    - "Global Search across sites, patients, deviations, CAPAs, and protocol rules with RBAC filtering"
    - "Notification Center from real application data; Filterable Audit Trail; Recent Reports tracker"
    - "Server-side RBAC (4 roles), audit trail, MongoDB + in-memory fallback, full enterprise SPA"
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Python standard-library HTTP server (no external web framework)", "MCP Python SDK v2.2 (mcp[cli])"]
    ibm_technologies: ["IBM Bob MCP integration (src/mcp_server.py, .bob/mcp.json, 13 tools, STDIO transport, mcp[cli]>=2.2)"]
    databases: ["MongoDB", "PyMongo", "Deterministic in-memory fallback"]
    other: ["Deterministic synthetic clinical-trial data (seed=37037)", "PBKDF2-SHA256 sessions", "Chart.js"]
  what_we_are_most_proud_of: >
    The end-to-end decision loop with real IBM Bob integration: open the project in IBM Bob, ask "Why is Site S037 high risk?" — Bob calls get_site_risk and explain_site_risk against the real MongoDB-backed TrialGuard database, returns a score of 87/100 WORSENING with evidence, then ask "Generate a CAPA" — Bob calls generate_capa and returns CAPA-XXXXXX with the problem statement grounded in actual deviation records. All 13 tools discoverable, all RBAC rules enforced, zero hardcoded responses.
  known_limitations: >
    IBM Bob MCP integration is implemented (src/mcp_server.py, .bob/mcp.json, 13 tools, mcp[cli] v2.2, STDIO transport, 52 tests passing). Actual end-to-end invocation through IBM Bob UI requires IBM Bob to be installed and the workspace folder open — this could not be verified in a headless environment. MongoDB fallback to in-memory means data does not persist across server restarts unless MongoDB is running. Production deployment, TLS, durable session store, and formal clinical validation are future work.

